<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trainingsplan Heading East</title>
<meta name="theme-color" content="#f3f5f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1519" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first app shell, one column of day content, fixed bottom tab bar */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --line:#dde3e6; --fg:#16212a; --muted:#5d6b75;
  --accent:#0f6e86; --accent-soft:#e1f0f4; --bike:#2f7d4f; --bike-soft:#e3f2e8;
  --run:#9a5b12; --run-soft:#f7ecdc; --hyrox:#8a3a6e; --hyrox-soft:#f5e5ef;
  --rest:#6b7780; --rest-soft:#eceff1; --ok:#2f7d4f; --warn:#a4620f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172027; --line:#26333c; --fg:#e6edf1; --muted:#93a3ad;
  --accent:#5cc0d8; --accent-soft:#16323b; --bike:#6fcf95; --bike-soft:#173225;
  --run:#e3a861; --run-soft:#33261a; --hyrox:#de8fc2; --hyrox-soft:#36202f;
  --rest:#93a3ad; --rest-soft:#1f2a31; --ok:#6fcf95; --warn:#e3a861; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172027; --line:#26333c; --fg:#e6edf1; --muted:#93a3ad;
  --accent:#5cc0d8; --accent-soft:#16323b; --bike:#6fcf95; --bike-soft:#173225;
  --run:#e3a861; --run-soft:#33261a; --hyrox:#de8fc2; --hyrox-soft:#36202f;
  --rest:#93a3ad; --rest-soft:#1f2a31; --ok:#6fcf95; --warn:#e3a861; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(88px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 4px}
.phase{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.daynav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.daytitle{text-align:center}
.daytitle .d{font-family:var(--display);font-size:22px;font-weight:600}
.today-link{background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;padding:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px}
.k-strength{background:var(--accent-soft);color:var(--accent)}
.k-bike{background:var(--bike-soft);color:var(--bike)}
.k-run{background:var(--run-soft);color:var(--run)}
.k-hyrox{background:var(--hyrox-soft);color:var(--hyrox)}
.k-rest{background:var(--rest-soft);color:var(--rest)}
.session-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.session-head .meta{font-size:13px;color:var(--muted);margin-top:4px}
.notice{border-left:3px solid var(--warn);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;font-size:14px}
.donebtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ex{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.ex:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ex-name{font-weight:600}
.ex-target{font-size:13px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--accent);margin-top:2px}
.hint.warn{color:var(--warn)}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 44px;gap:6px 8px;align-items:center;margin-top:8px}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sets .n{font-family:var(--display);font-weight:600;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-variant-numeric:tabular-nums;text-align:center;font-size:16px}
.setchk{width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.setchk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.steps{margin:8px 0 0;padding-left:20px}
.steps li{margin-bottom:4px}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;padding:8px 10px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.field input{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;padding:0 10px;font-size:16px;min-width:0}
/* week */
.week{display:flex;flex-direction:column;gap:8px}
.wday{display:grid;grid-template-columns:52px minmax(0,1fr) 28px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.wday.is-today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.wday .dname{font-family:var(--display);font-size:18px;font-weight:700;line-height:1}
.wday .ddate{font-size:12px;color:var(--muted)}
.wday .wt{font-weight:600;overflow-wrap:anywhere}
.wday .wd{font-size:13px;color:var(--muted)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--surface)}
.check.on{background:var(--ok);border-color:var(--ok)}
.weekstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
/* plan */
.timeline{position:relative;height:auto}
.tl-bar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.tl-seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;padding:0 4px}
.tl-now{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--fg)}
.tl-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
ul.plain{margin:6px 0 0;padding-left:18px}
ul.plain li{margin-bottom:5px}
/* progress */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.inline-form{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.btn{height:40px;border-radius:8px;border:0;background:var(--accent);color:var(--surface);font-weight:600;padding:0 16px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list td{padding:6px 0;border-bottom:1px solid var(--line)}
table.list td:last-child{text-align:right}
.editlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.editrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--surface);border:0;border-top:1px solid var(--line);text-align:left;width:100%}
.editrow:first-child{border-top:0}
.editrow .tag{margin-right:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.iconbtn.sm{width:36px;height:36px;font-size:15px}
.iconbtn:disabled{opacity:.35;cursor:default}
label.field select{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;padding:0 8px;font-size:16px;min-width:0}
input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent)}
.phasebox{display:flex;flex-direction:column;gap:2px;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:13.5px}
.phasebox b{color:var(--accent)}
details.warm{margin-top:10px;font-size:14px}
details.warm summary{cursor:pointer;color:var(--accent);font-weight:600}
.last{font-size:13px;font-weight:600;margin-top:3px}
.tip{font-size:12.5px;color:var(--muted);margin-top:2px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 4px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.daygrid{display:flex;flex-direction:column;gap:8px}
.dayrow{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center}
.dayrow .dname{font-family:var(--display);font-weight:700;font-size:18px}
.dayrow select{height:42px;min-width:0;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:15px;padding:0 8px}
.garmin{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:13.5px}
.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:7px;vertical-align:1px}
.del{background:none;border:0;color:var(--muted);padding:4px 8px}
/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:20}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.sync{font-size:11.5px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.wday,.donebtn,.setchk{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="eyebrow" id="countdown">Trainingsplan</div>
      <h1 id="viewTitle">Heute</h1>
    </div>
    <span class="phase" id="phaseChip">Block 1</span>
  </header>
  <main id="view" class="stack"></main>
  <p class="sync" id="sync"></p>
</div>

<nav class="tabs" aria-label="Bereiche">
  <div class="in">
    <button data-tab="day" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Training</button>
    <button data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Woche</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>Plan</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19l5-6 4 3 7-9"/></svg>Fortschritt</button>
  </div>
</nav>

<script>
(() => {
"use strict";
// ---------- Plan data (from "Trainingsplan Nov 2026 – Apr 2027") ----------
const DEFAULTS = { start: "2026-11-02", block1End: "2027-02-28", hyrox: "2027-03-27", event: "2027-04-30", ftp: null };

// Kraftblock nach "Hyrox_Kraftblock_8_Wochen.md", Variante A (3 Einheiten, Ganzkörper A → B → C)
// sets/lo/hi = Wochen 1–3 (Aufbau), str = Wochen 5–7 (Grundkraft)
// role: main = Hauptübung (8er-Test in Woche 8), acc = Zusatzübung, steady = Kettlebell (bleibt in Entlastung gleich)
const EX_BASE = {
  squat:    {name:"Kniebeuge (Back Squat)", role:"main", sets:3, lo:8, hi:8, str:{sets:4, lo:5, hi:5}, inc:5, start:40, pause:"2,5–3 min"},
  pull:     {name:"Klimmzüge", role:"acc", sets:3, lo:5, hi:8, str:{sets:4, lo:4, hi:6}, bodyweight:true, pause:"Supersatz", tip:"Bei Bedarf mit Band oder Maschine. Erst Wiederholungen steigern, dann Zusatzgewicht."},
  bss:      {name:"Bulgarian Split Squat (Kurzhanteln)", role:"acc", sets:3, lo:8, hi:8, str:{sets:3, lo:6, hi:6}, per:"pro Bein", inc:2, pause:"90 s"},
  suitcase: {name:"Kettlebell Suitcase Carry", role:"steady", sets:3, lo:30, hi:30, unit:"m", per:"pro Seite", inc:4, pause:"60 s", tip:"Kettlebell einseitig, Schultern und Hüfte bleiben waagerecht. Direkter Transfer zum Farmers Carry."},
  bench:    {name:"Bankdrücken (Langhantel)", role:"main", sets:3, lo:8, hi:8, str:{sets:4, lo:5, hi:5}, inc:2.5, start:40, pause:"2,5 min"},
  bbrow:    {name:"Langhantelrudern vorgebeugt", role:"acc", sets:3, lo:8, hi:8, str:{sets:4, lo:6, hi:6}, inc:2.5, pause:"Supersatz"},
  dbpress:  {name:"Schulterdrücken stehend (Kurzhanteln)", role:"acc", sets:3, lo:8, hi:8, str:{sets:3, lo:6, hi:6}, inc:2, pause:"90 s"},
  halo:     {name:"Kettlebell Halo + Half-Kneeling Press", role:"steady", sets:3, lo:8, hi:8, per:"pro Seite", inc:4, pause:"60 s", tip:"Kettlebell um den Kopf kreisen, dann einarmig drücken. Rippenbogen unten, kein Hohlkreuz."},
  dead:     {name:"Kreuzheben (konventionell)", role:"main", sets:3, lo:6, hi:6, str:{sets:4, lo:4, hi:4}, inc:5, start:45, pause:"3 min", tip:"Bewusst eine Wiederholung weniger als bei den anderen Hauptübungen: Die Ermüdung der Wirbelsäule ist neben dem Laufen der teuerste Faktor."},
  pullW:    {name:"Klimmzüge (breiter Griff)", link:"pull", role:"acc", sets:3, lo:5, hi:8, str:{sets:4, lo:4, hi:6}, bodyweight:true, pause:"Supersatz", tip:"Erst Wiederholungen steigern, dann Zusatzgewicht."},
  lunge:    {name:"Walking Lunges mit Kurzhanteln", role:"acc", sets:3, lo:10, hi:10, str:{sets:3, lo:8, hi:8}, per:"pro Bein", inc:2, pause:"90 s"},
  tgu:      {name:"Kettlebell Turkish Get-Up (halbe Version)", role:"steady", sets:3, lo:3, hi:3, per:"pro Seite", inc:4, pause:"60 s", tip:"Aus der Rückenlage über Ellbogen und Hand in den Sitz und zurück. Langsam und kontrolliert."},
  // weitere Übungen, im Editor einsetzbar
  rdl:      {name:"Rumänisches Kreuzheben", role:"acc", sets:3, lo:8, hi:10, inc:5},
  legcurl:  {name:"Beinbeuger-Maschine", role:"acc", sets:3, lo:10, hi:10, str:{sets:3, lo:8, hi:8}, inc:2.5},
  calf:     {name:"Wadenheben stehend", role:"acc", sets:3, lo:12, hi:12, str:{sets:3, lo:10, hi:10}, inc:2.5},
  hipthrust:{name:"Hip Thrust (Langhantel)", role:"acc", sets:3, lo:10, hi:10, str:{sets:3, lo:8, hi:8}, inc:5},
  row:      {name:"Kabelrudern eng", role:"acc", sets:3, lo:10, hi:10, str:{sets:3, lo:8, hi:8}, inc:2.5},
  incline:  {name:"Schrägbankdrücken (Kurzhanteln)", role:"acc", sets:3, lo:10, hi:10, str:{sets:3, lo:8, hi:8}, inc:2},
  renegade: {name:"Kettlebell Renegade Row", role:"steady", sets:3, lo:6, hi:6, per:"pro Seite", inc:4},
  ohp:      {name:"Kurzhantel-Schulterdrücken sitzend", role:"acc", sets:3, lo:8, hi:10, inc:2},
  face:     {name:"Face Pulls", role:"acc", sets:3, lo:15, hi:15, inc:2.5},
  goblet:   {name:"Goblet Squat", role:"acc", sets:3, lo:10, hi:10, inc:2},
  farmer:   {name:"Farmers Carry", role:"steady", sets:4, lo:40, hi:40, unit:"m", inc:2},
  plank:    {name:"Plank", role:"steady", sets:3, lo:45, hi:45, unit:"s", bodyweight:true},
};
const WORKOUTS_BASE = {
  A: {title:"Kraft A – Kniebeuge-Fokus", ex:["squat","pull","bss","suitcase"], min:45, int:""},
  B: {title:"Kraft B – Bankdrücken-Fokus", ex:["bench","bbrow","dbpress","halo"], min:45, int:""},
  C: {title:"Kraft C – Kreuzheben-Fokus", ex:["dead","pullW","lunge","tgu"], min:45, int:""},
};
const WARMUP = ["5 × Katze-Kuh, 10 × Hüftkreisen pro Seite, 10 × Schulterkreisen mit Band",
  "10 × Kniebeuge mit Körpergewicht, 10 × Ausfallschritt im Wechsel, 10 × Glute Bridge",
  "Hauptübung: 2–3 Aufwärmsätze mit steigender Last (leere Stange → ca. 50 % → ca. 75 % des Arbeitsgewichts)"];

// ---------- date helpers ----------
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const mondayOf = s => { const d = parse(s); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return iso(d); };
const DAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTHS = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const fmtShort = s => { const d = parse(s); return `${d.getDate()}. ${MONTHS[d.getMonth()]}`; };
const fmtLong = s => { const d = parse(s); return `${["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"][d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const TODAY = iso(new Date());

// ---------- state ----------
const state = {
  tab: "day", date: TODAY, weekStart: mondayOf(TODAY),
  settings: {...DEFAULTS}, sessions: {}, weights: {}, custom: {}, garmin: {}, source: "local", edit: null
};

// ---------- your own changes to the plan (state.custom) ----------
// custom.ex[id]       = fields overriding an exercise (or a new exercise "x_…")
// custom.workouts[id] = {title, min, int, ex:[ids]} overriding a strength session
// custom.sessions[key]= {kind, title, dur, steps} overriding an endurance slot (key = block + weekday)
const EX = {}, WORKOUTS = {};
function applyCustom() {
  const c = state.custom || {};
  for (const k in EX) delete EX[k];
  for (const k in WORKOUTS) delete WORKOUTS[k];
  for (const [id, e] of Object.entries(EX_BASE)) EX[id] = {...e};
  for (const [id, e] of Object.entries(c.ex || {})) {
    const m = {...(EX_BASE[id] || {}), ...e};
    for (const k in m) if (m[k] === null) delete m[k];   // null = field cleared by you
    EX[id] = m;
  }
  for (const [id, w] of Object.entries(WORKOUTS_BASE)) {
    const o = (c.workouts || {})[id] || {};
    WORKOUTS[id] = {...w, ...o, ex: (o.ex || w.ex).filter(x => EX[x])};
  }
}
applyCustom();

  if (date <= s.hyrox) return {id:"b2", label:"Block 2 · Hyrox + Radaufbau"};

}

}

// your weekday layout per block: custom.days[block][weekday] = weekday whose session goes there, or "rest"
const BLOCKS = {b1:"Block 1 · Nov–Feb", b2:"Block 2 · März bis Hyrox", b3:"Block 3 · April bis Heading East"};
function blockOf(date) { const id = phaseOf(date).id; return BLOCKS[id] ? id : null; }
function arrangedBase(date) {
  const s = state.settings, b = blockOf(date), map = b && ((state.custom || {}).days || {})[b];

  const wd = parse(date).getDay(), src = map[wd];
  if (src === undefined || src === null || Number(src) === wd) return sessionBase(date);

  let srcDate = addDays(mondayOf(date), (Number(src) + 6) % 7);
  if (srcDate === s.hyrox || srcDate === s.event || blockOf(srcDate) !== b) srcDate = addDays(srcDate, blockOf(addDays(srcDate, -7)) === b ? -7 : 7);

}
function sessionFor(date) {

  if (!o) return x;
  return {...x, ...o, steps: o.steps && o.steps.length ? o.steps : x.steps, note: o.steps ? "" : x.note, edited: true};
}
// every editable endurance slot, with the first date it occurs (for showing its default)
function enduranceSlots() {
  const s = state.settings, out = [], seen = new Set();
  for (let d = s.start; d < s.event; d = addDays(d, 1)) {
    if (d === s.hyrox) continue;
    const x = sessionBase(d);
    if (!x.key || x.kind === "strength" || seen.has(x.key)) continue;
    seen.add(x.key); out.push({key: x.key, date: d, base: x});
  }
  const order = {b1:0, b2:1, b3r:2, b3:3, b3t:4};

}

// ---------- progression ----------
function exKey(id) { return EX[id].link || id; }
function history(id) {
  // all logged sessions (before current date) that contain this exercise or its linked base
  const key = exKey(id), out = [];
  for (const [d, s] of Object.entries(state.sessions)) {
    if (!s || !s.log) continue;
    for (const [eid, sets] of Object.entries(s.log)) {
      if (!EX[eid] || exKey(eid) !== key) continue;
      const done = (sets || []).filter(x => x && x.kg !== "" && x.kg != null && Number(x.reps) > 0);
      if (done.length) out.push({date:d, eid, sets:done});
    }
  }
  return out.sort((a,b) => a.date < b.date ? -1 : 1);
}
// where in the strength block a date sits
function strengthPhase(date) {
  if (phaseOf(date).id !== "b1") return {kind:"maint", label:"Erhaltung (März/April)",
    info:"Kraft halten: Hauptübung 3 schwere Sätze bei RPE 7–8, Zusatzübungen 2 Sätze, Kettlebell unverändert."};
  const w = block1Week(date);
  if (w > 16) return {kind:"deload", label:"Entlastung vor Block 2",
    info:"Hauptübung 2 Sätze mit ca. 80 % des letzten Arbeitsgewichts, Zusatzübungen 2 Sätze bei RPE 5–6. Kettlebell-Übungen bleiben gleich."};
  const cw = (w - 1) % 8 + 1, cyc = w > 8 ? 2 : 1, head = `Zyklus ${cyc} · Woche ${cw} von 8 · `;
  if (cw <= 3) return {kind:"vol", label:head + "Aufbau", info:"RPE 6–7,5: 2–4 Wiederholungen bleiben im Tank. Niemals bis zum Muskelversagen, du musst am nächsten Tag laufen können."};
  if (cw === 4) return {kind:"deload", label:head + "Entlastung", info:"Hauptübung 2 Sätze mit ca. 80 % des letzten Arbeitsgewichts, Zusatzübungen 2 Sätze bei RPE 5–6. Kettlebell-Übungen bleiben gleich."};
  if (cw <= 7) return {kind:"str", label:head + "Grundkraft", info:"RPE 7,5–8,5: 1–2 Wiederholungen bleiben im Tank. Weiterhin nie bis zum Versagen."};
  return {kind:"test", label:head + "Entlastung + Standortbestimmung",
    info:"Hauptübung: nach den Aufwärmsätzen ein Satz mit 8 sauberen Wiederholungen bei RPE 9 (kein Maximalversuch). Zusatzübungen locker. Notiere außerdem: maximale Klimmzüge am Stück und die Farmers-Carry-Distanz mit 2 × 24 kg."};
}
// sets and rep range for an exercise on a given day
function prescription(id, date) {
  const e = EX[id] || {}, sp = strengthPhase(date), role = e.role || "acc";
  const vol = {sets: e.sets, lo: e.lo, hi: e.hi}, str = e.str || vol;
  if (sp.kind === "vol") return vol;
  if (sp.kind === "str") return str;
  if (role === "steady") return vol;
  if (sp.kind === "deload") return {sets: 2, lo: vol.lo, hi: vol.hi};
  if (sp.kind === "test") return role === "main" ? {sets: 1, lo: 8, hi: 8} : {sets: 2, lo: str.lo, hi: str.hi};
  return role === "main" ? {sets: 3, lo: Math.min(5, str.lo), hi: Math.min(5, str.hi)} : {sets: 2, lo: str.lo, hi: str.hi};
}
const roundKg = (v, e) => { const st = (e.inc || 0) >= 2.5 ? 2.5 : (e.inc || 1); return Math.round(v / st) * st; };
const topKg = h => Math.max(...h.sets.map(x => Number(x.kg)));
// "Zuletzt am 4. Nov: 45 kg × 8 · 8 · 8" (sets grouped by weight, any earlier session incl. deloads)
function lastText(id, date) {
  const e = EX[id], h = history(id).filter(x => x.date < date);
  if (!h.length) return "";
  const last = h[h.length - 1], unit = e.unit ? " " + e.unit : "", groups = [];
  last.sets.forEach(x => {
    const kg = Number(x.kg), g = groups[groups.length - 1];
    if (g && g.kg === kg) g.reps.push(x.reps); else groups.push({kg, reps: [x.reps]});
  });
  const body = groups.map(g => {
    const reps = g.reps.join(" · ") + unit;
    if (e.bodyweight) return g.kg > 0 ? `+${num(g.kg)} kg × ${reps}` : `${reps}${e.unit ? "" : " Wdh."}`;
    return `${num(g.kg)} kg × ${reps}`;
  }).join(", ");

  return `Zuletzt am ${fmtShort(last.date)}${other}: ${body}`;
}
function reached(h) { const p = prescription(h.eid, h.date); return h.sets.length >= p.sets && h.sets.every(x => Number(x.reps) >= p.hi); }
function suggestion(id, date) {
  const e = EX[id], sp = strengthPhase(date);
  if (e.bodyweight) return {kg:null, text:""};
  // working sessions only: deload weeks and the light accessory work of test weeks do not count
  const work = history(id).filter(x => x.date < date).filter(x => { const k = strengthPhase(x.date).kind; return k !== "deload" && !(k === "test" && (EX[x.eid] || {}).role !== "main"); });

    const base = EX[exKey(id)];
    if (base.start != null) return {kg:base.start, text:`Startgewicht ${num(base.start)} kg${e.role === "main" ? " (inkl. 20-kg-Stange)" : ""}`};
    return {kg:null, text:"Erstes Mal: ein Gewicht wählen, bei dem 2–3 Wiederholungen im Tank bleiben"};
  }
  const last = work[work.length - 1], top = topKg(last), lk = strengthPhase(last.date).kind;
  if (sp.kind === "deload" && e.role !== "steady") { const kg = roundKg(top * 0.8, e); return {kg, text:`Entlastung: ca. 80 % von ${num(top)} kg`}; }
  if (sp.kind === "test" && e.role === "main") return {kg:top, text:`8er-Test: nach den Aufwärmsätzen so weit steigern, dass 8 saubere Wdh. bei RPE 9 gehen. Zuletzt ${num(top)} kg.`};
  if (sp.kind === "maint" && lk !== "maint") { const kg = lk === "test" ? roundKg(top * 0.9, e) : top; return {kg, text:`Erhaltung: mit ${num(kg)} kg weitermachen, RPE höchstens 8`}; }
  if (lk === "test" && sp.kind !== "test") { const kg = roundKg(top * 0.9, e); return {kg, text:`Neuer Zyklus: ca. 90 % deines 8er-Tests (${num(top)} kg)`}; }
  if (sp.kind === "str" && lk === "vol") { const kg = roundKg(top * 1.06, e); return {kg, text:`Grundkraft: Gewicht aus der Aufbauphase (${num(top)} kg) plus ca. 6 %`}; }

  }

}

// ---------- storage (on this device) ----------
const LS = "trainingsplan-v1";
let storageOk = true;
function lsLoad(){ try { const j = JSON.parse(localStorage.getItem(LS) || "{}"); Object.assign(state.settings, j.settings||{}); state.sessions = j.sessions||{}; state.weights = j.weights||{}; state.custom = j.custom||{}; state.garmin = j.garmin||{}; applyCustom(); } catch(e){ storageOk = false; } }
function lsSave(){ try { localStorage.setItem(LS, JSON.stringify({version:1, settings:state.settings, sessions:state.sessions, weights:state.weights, custom:state.custom, garmin:state.garmin})); storageOk = true; } catch(e){ storageOk = false; } setSync(); }
// every change stamps the record with `u` (ms) so two devices can be merged record by record
function persist(path) {
  const now = Date.now(), [col, id] = (path || "").split("/");
  if (col === "sessions" && state.sessions[id]) state.sessions[id].u = now;
  if (col === "weights") state.weights[id] = state.weights[id] && state.weights[id].kg ? {...state.weights[id], u: now} : {date: id, deleted: true, u: now};
  if (col === "settings") state.settings.u = now;
  if (col === "custom") { state.custom.u = now; applyCustom(); }
  lsSave(); Sync.schedule();
}
function setSync(){
  const el = document.getElementById("sync");
  if (!storageOk) { el.textContent = "Speichern nicht möglich (privater Modus?). Einträge gehen beim Schließen verloren."; return; }
  el.textContent = Sync.on() ? Sync.statusText() : "Daten liegen nur auf diesem Gerät. Unter Plan → Geräte-Sync kannst du den Abgleich einschalten.";
}

// ---------- sync across devices via a private GitHub Gist ----------
const Sync = (() => {

    for (const k of ["sessions", "weights", "garmin"]) {
      const keys = new Set([...Object.keys(local[k] || {}), ...Object.keys(remote[k] || {})]);
      keys.forEach(id => { out[k][id] = pickNewer((local[k] || {})[id], (remote[k] || {})[id]); });
    }
    return out;
  }
  async function findGist() {
    for (let page = 1; page <= 5; page++) {
      const list = await api(`/gists?per_page=100&page=${page}`);
      const hit = list.find(g => g.description === DESC && g.files && g.files[FILE]);
      if (hit) return hit.id;
      if (list.length < 100) break;
    }
    return null;
  }
  async function readRemote() {
    const g = await api("/gists/" + cfg.gist);
    const f = g.files && g.files[FILE]; if (!f) return {};
    let text = f.content;
    if (f.truncated) text = await (await fetch(f.raw_url)).text();
    try { return JSON.parse(text || "{}"); } catch(e) { return {}; }
  }

    if (!cfg.token) return;
    if (busy) { again = true; return; }

      const remoteText = JSON.stringify({app:"trainingsplan", version:1, settings: remote.settings || {}, custom: remote.custom || {}, sessions: remote.sessions || {}, weights: remote.weights || {}, garmin: remote.garmin || {}});
      const localChanged = JSON.stringify(merged) !== JSON.stringify({settings:state.settings, custom:state.custom, sessions:state.sessions, weights:state.weights, garmin:state.garmin});
      // keep any field the person is typing into right now: re-stamped records win next round
      state.settings = {...DEFAULTS, ...merged.settings}; state.sessions = merged.sessions; state.weights = merged.weights; state.custom = merged.custom; state.garmin = merged.garmin; applyCustom();

const GARMIN_TYPES = {road_biking:"Rennrad", indoor_cycling:"Indoor-Rad", virtual_ride:"Virtuelle Ausfahrt", cycling:"Rad", gravel_cycling:"Gravel", mountain_biking:"MTB",

const garminActs = d => ((state.garmin || {})[d] || {}).acts || [];
function garminMatch(d, x) {
  if (x.kind !== "bike" && x.kind !== "run") return [];

// explicit tick wins (true or false); otherwise a matching Garmin activity counts
function isDone(d, x) {
  const r = state.sessions[d] || {};

function actLine(a) {
  const parts = [GARMIN_TYPES[a.type] || a.name || "Aktivität"];

  if (a.km) parts.push(`${num(Math.round(a.km * 10) / 10)} km`);
  if (a.w) parts.push(`${Math.round(a.w)} W`);

}

  const conn = document.getElementById("syncConnect");

  const off = document.getElementById("syncOff");

  document.getElementById("exportBtn").onclick = () => {

      lsSave(); render();

function lineChart(series, opts) {
  // series: [{name,color,pts:[{x:date,y}]}]
  const W = 600, H = 220, L = 40, R = 14, T = 12, B = 28;
  const all = series.flatMap(s => s.pts);
  if (!all.length) return `<p class="muted" style="margin:8px 0 0">${esc(opts.empty)}</p>`;
  const xs = all.map(p => parse(p.x).getTime()), ys = all.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 3*864e5; x1 += 3*864e5; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad_ = Math.max(1, (y1-y0)*0.15); y0 = Math.floor((y0-pad_)/opts.step)*opts.step; y1 = Math.ceil((y1+pad_)/opts.step)*opts.step;
  const sx = t => L + (t - x0) / (x1 - x0) * (W - L - R), sy = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const ticks = []; const n = 4; for (let i = 0; i <= n; i++) ticks.push(y0 + (y1-y0)*i/n);
  let g = ticks.map(v => `<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${num(Math.round(v*10)/10)}</text>`).join("");
  const d0 = new Date(x0), d1 = new Date(x1);
  g += `<text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${fmtShort(iso(d0))}</text><text x="${W-R}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtShort(iso(d1))}</text>`;
  series.forEach(s => {
    if (!s.pts.length) return;
    const p = s.pts.map(q => `${sx(parse(q.x).getTime()).toFixed(1)},${sy(q.y).toFixed(1)}`);
    g += `<polyline points="${p.join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.pts.forEach((q, i) => { const last = i === s.pts.length-1; g += `<circle cx="${sx(parse(q.x).getTime())}" cy="${sy(q.y)}" r="${last ? 4.5 : 2.5}" fill="${last ? s.color : "var(--surface)"}" stroke="${s.color}" stroke-width="2"><title>${s.name}: ${num(q.y)} ${opts.unit} am ${fmtShort(q.x)}</title></circle>`; });
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">${g}</svg></div>`;
}

function renderProgress() {
  const lifts = [["squat","Kniebeuge","var(--accent)"],["dead","Kreuzheben","var(--bike)"],["bench","Bankdrücken","var(--hyrox)"]];
  const series = lifts.map(([id,name,color]) => ({name, color, pts: history(id).map(h => ({x:h.date, y:Math.max(...h.sets.map(s => Number(s.kg)))}))}));
  const best = lifts.map(([id,name],i) => { const p = series[i].pts; return `<div class="stat"><div class="v">${p.length ? num(p[p.length-1].y) + " kg" : "–"}</div><div class="l">${name}</div></div>`; }).join("");
  const wEntries = Object.entries(state.weights).filter(([,v]) => v && v.kg).sort((a,b) => a[0] < b[0] ? -1 : 1);
  // weekly averages
  const weeks = {}; wEntries.forEach(([d,v]) => { const m = mondayOf(d); (weeks[m] = weeks[m] || []).push(Number(v.kg)); });
  const wAvg = Object.entries(weeks).sort((a,b)=>a[0]<b[0]?-1:1).map(([m,a]) => ({x:addDays(m,3), y:Math.round(a.reduce((s,v)=>s+v,0)/a.length*10)/10}));
  let trend = "";
  if (wAvg.length >= 2) { const a = wAvg[wAvg.length-2].y, b = wAvg[wAvg.length-1].y, dlt = Math.round((b-a)*10)/10; trend = `Letzte Woche ${dlt <= 0 ? "" : "+"}${num(dlt)} kg zum Vorwochenschnitt (Ziel: −0,25 bis −0,5 kg).`; }
  $view.innerHTML = `
  <section class="card stack">
    <div class="row between"><h2>Kraftwerte</h2><span class="muted" style="font-size:12px">schwerster Satz je Einheit</span></div>
    <div class="weekstats">${best}</div>
    ${lineChart(series, {unit:"kg", step:5, label:"Verlauf der Hauptübungen", empty:"Sobald du Sätze einträgst, erscheint hier dein Verlauf. Ziel bis Ende Februar: Kniebeuge 70–80 kg, Kreuzheben 90–100 kg."})}
    <div class="legend">${lifts.map(([,n,c]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}</div>
  </section>
  <section class="card stack">
    <h2>Körpergewicht</h2>
    <form class="inline-form" id="wForm">
      <label class="field">Datum<input type="date" id="w-date" value="${TODAY}"></label>
      <label class="field">Gewicht (kg)<input inputmode="decimal" id="w-kg" placeholder="z. B. 78,4"></label>
      <button class="btn" type="submit">Eintragen</button>
    </form>
    ${lineChart([{name:"Wochenschnitt", color:"var(--accent)", pts:wAvg}], {unit:"kg", step:1, label:"Körpergewicht Wochenschnitt", empty:"Trag dein Gewicht ein paarmal pro Woche ein. Die Linie zeigt den Wochenschnitt."})}
    ${trend ? `<p style="margin:0">${esc(trend)}</p>` : ""}
    ${wEntries.length ? `<table class="list num">${wEntries.slice(-8).reverse().map(([d,v]) => `<tr><td>${fmtLong(d)}</td><td>${num(v.kg)} kg <button class="del" data-delw="${d}" aria-label="Eintrag löschen">✕</button></td></tr>`).join("")}</table>` : ""}
  </section>`;
  document.getElementById("wForm").addEventListener("submit", e => {
    e.preventDefault();
    const d = document.getElementById("w-date").value, kg = Number(document.getElementById("w-kg").value.replace(",", "."));
    if (!d || !kg || kg < 30 || kg > 250) { document.getElementById("w-kg").focus(); return; }
    state.weights[d] = {date:d, kg}; persist("weights/"+d, state.weights[d], true); renderProgress();
  });
  $view.querySelectorAll("[data-delw]").forEach(b => b.onclick = () => { const d = b.dataset.delw; delete state.weights[d]; persist("weights/"+d, null, true); renderProgress(); });
}

// a normal week of a block, to label the sessions you can place
function blockWeek(b) {
  const s = state.settings;
  let mon = b === "b1" ? mondayOf(s.start) : b === "b2" ? mondayOf(addDays(s.block1End, 1)) : mondayOf(addDays(s.hyrox, 8));
  if (b === "b2" && mon < addDays(s.block1End, 1)) mon = addDays(mon, 7);
  if (b === "b3" && diffDays(s.hyrox, mon) <= 7) mon = addDays(mon, 7);
  const out = {};
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), wd = parse(d).getDay(), x = sessionBase(d);
    let label = x.kind === "strength" ? (b === "b1" ? WORKOUTS[x.w].title : "Kraft (A, B, C im Wechsel)") : x.title;
    if (b === "b1" && wd === 0) label = "Lauf locker (ab Februar: Hyrox-Stationen)";
    out[wd] = {kind: x.kind, label, dur: x.dur};
  }
  return out;
}
function renderEditDays(b) {
  const c = cust(); c.days = c.days || {};
  const week = blockWeek(b), map = c.days[b] || {}, order = [1,2,3,4,5,6,0];
  const cur = wd => map[wd] === undefined ? wd : map[wd];
  const kindOf = v => v === "rest" ? "rest" : week[v].kind;
  // checks
  const warn = [];
  const used = order.map(cur).filter(v => v !== "rest");
  order.forEach(v => { if (week[v].kind !== "rest" && !used.includes(v)) warn.push(`„${week[v].label}“ kommt in der Woche nicht mehr vor.`); });
  order.forEach(v => { const n = used.filter(u => u === v).length; if (n > 1) warn.push(`„${week[v].label}“ steht ${n}× in der Woche.`); });
  for (let i = 0; i < 7; i++) { const a = order[i], z = order[(i + 1) % 7]; if (kindOf(cur(a)) === "strength" && kindOf(cur(z)) === "strength") warn.push(`Kraft am ${WD_NAMES[a]} und ${WD_NAMES[z]}: Zwischen zwei Krafteinheiten sollte mindestens ein Tag liegen.`); }
  if (!order.some(wd => kindOf(cur(wd)) === "rest") && b !== "b1") warn.push("Kein kompletter Ruhetag in der Woche.");
  if (b === "b1" && !order.some(wd => kindOf(cur(wd)) === "rest" || (cur(wd) === 0))) warn.push("Kein Ruhetag in der Woche. Der Sonntag (Lauf oder frei) ist als Ruhetag gedacht.");
  $view.innerHTML = backBtn("Zurück zum Plan") + `
  <div class="seg" role="tablist">${Object.entries(BLOCKS).map(([k, l]) => `<button role="tab" data-blk="${k}" aria-selected="${k === b}">${l.split(" · ")[0]}</button>`).join("")}</div>
  <section class="card stack">
    <div><div class="eyebrow">${BLOCKS[b]}</div><h2 style="margin-top:4px">Welche Einheit an welchem Tag?</h2></div>
    <p class="muted" style="margin:0;font-size:13px">Gilt für jede Woche dieses Blocks. Steigerungen, Entlastungswochen und der Wechsel von A, B und C laufen weiter mit. Hyrox und der Start von Heading East bleiben auf ihrem Datum.</p>
    <div class="daygrid">${order.map(wd => `
      <label class="dayrow"><span class="dname">${DAYS[wd]}</span>
        <select data-day="${wd}">${order.filter(v => week[v].kind !== "rest").map(v => `<option value="${v}"${String(cur(wd)) === String(v) ? " selected" : ""}>${esc(week[v].label)}${week[v].dur ? " · " + esc(week[v].dur) : ""}</option>`).join("")}
          <option value="rest"${kindOf(cur(wd)) === "rest" ? " selected" : ""}>Ruhetag</option></select></label>`).join("")}
    </div>
    ${warn.length ? `<div class="notice">${warn.map(esc).join("<br>")}</div>` : `<p class="muted" style="margin:0;font-size:13px">Jede Einheit kommt genau einmal vor.</p>`}
    <div class="row" style="flex-wrap:wrap">${c.days[b] ? `<button class="btn ghost" id="days-reset">Originale Tage wiederherstellen</button>` : ""}</div>
    <p id="days-msg" class="muted" style="margin:0;font-size:13px" aria-live="polite"></p>
  </section>
  <p class="muted" style="font-size:13px;margin:0">Aus dem Kraftplan: Beintage nicht direkt vor eine harte Lauf- oder Radeinheit legen. Ideal ist Kraft am selben Tag wie eine lockere Ausdauereinheit, Kraft zuerst oder mindestens 6 Stunden Abstand.</p>`;
  document.getElementById("editBack").onclick = () => setTab("plan");
  $view.querySelectorAll("[data-blk]").forEach(t => t.onclick = () => { state.edit = {type:"days", block:t.dataset.blk}; render(); });
  $view.querySelectorAll("[data-day]").forEach(sel => sel.addEventListener("change", () => {
    const wd = Number(sel.dataset.day), v = sel.value === "rest" ? (week[wd].kind === "rest" ? wd : "rest") : Number(sel.value);
    const m = {...(c.days[b] || {})}; m[wd] = v;
    // drop entries that point to their own day; no entries left = original layout
    Object.keys(m).forEach(k => { if (String(m[k]) === String(k)) delete m[k]; });
    if (Object.keys(m).length) c.days[b] = m; else delete c.days[b];
    persist("custom/main"); renderEditDays(b);
    document.getElementById("days-msg").textContent = `${WD_NAMES[wd]}: ${kindOf(v) === "rest" ? "Ruhetag" : week[v].label}. Gespeichert.`;
  }));
  const rs = document.getElementById("days-reset");
  if (rs) rs.onclick = () => { delete c.days[b]; persist("custom/main"); renderEditDays(b); document.getElementById("days-msg").textContent = "Originale Tage wiederhergestellt."; };
}

      <div class="grid3">
        <label class="field">Sätze<input data-f="str.sets" inputmode="numeric" value="${(e.str || e).sets}"></label>
        <label class="field">${e.unit ? "Ziel von" : "Wdh. von"}<input data-f="str.lo" inputmode="numeric" value="${(e.str || e).lo}"></label>
        <label class="field">bis<input data-f="str.hi" inputmode="numeric" value="${(e.str || e).hi}"></label>
      </div>
      <div class="grid2">
        <label class="field">Art<select data-f="role">${[["main","Hauptübung"],["acc","Zusatzübung"],["steady","Kettlebell / Carry"]].map(([v, l]) => `<option value="${v}"${(e.role || "acc") === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
        <label class="field">Pause<input data-f="pause" value="${esc(e.pause || "")}" placeholder="z. B. 90 s"></label>
      </div>
      <label class="field">Zusatz zur Wiederholungszahl<input data-f="per" value="${esc(e.per || "")}" placeholder="z. B. pro Seite"></label>
      <div class="grid3">
        <label class="field">Einheit<select data-f="unit">${UNITS.map(([v, l]) => `<option value="${v}"${(e.unit || "") === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
        <label class="field">Steigerung kg<input data-f="inc" inputmode="decimal" value="${e.bodyweight ? "" : num(e.inc ?? 2.5)}" ${e.bodyweight ? "disabled" : ""}></label>
        <label class="field">Start kg<input data-f="start" inputmode="decimal" value="${e.start != null ? num(e.start) : ""}" placeholder="frei" ${e.bodyweight ? "disabled" : ""}></label>
      </div>
      <label class="row" style="font-size:14px;gap:8px"><input type="checkbox" data-f="bodyweight"${e.bodyweight ? " checked" : ""}> Ohne Gewicht (z. B. Plank, Klimmzüge mit Körpergewicht)</label>
    </section>`;
  });
  h += `<section class="card stack">
    <h3>Übung hinzufügen</h3>
    <label class="field">Aus deinen Übungen<select id="addExisting"><option value="">Übung wählen …</option>${others.map(([eid, e]) => `<option value="${eid}">${esc(e.name)}</option>`).join("")}</select></label>
    <div class="row" style="flex-wrap:wrap"><button class="btn ghost" id="addNew">Neue Übung anlegen</button></div>
  </section>
  ${changed ? `<button class="btn ghost" id="w-reset">Diese Einheit auf den Originalplan zurücksetzen</button>` : ""}
  <p id="w-msg" class="muted" style="margin:0;font-size:13px" aria-live="polite"></p>`;
  $view.innerHTML = h;
  document.getElementById("editBack").onclick = () => setTab("plan");
  const rerender = msg => { renderEditWorkout(id); if (msg) document.getElementById("w-msg").textContent = msg; };
  document.getElementById("w-title").addEventListener("input", ev => { if (ev.target.value.trim()) saveWorkout(id, {title: ev.target.value.trim()}); });
  document.getElementById("w-min").addEventListener("input", ev => { const v = parseInt(ev.target.value, 10); if (v > 0 && v < 600) saveWorkout(id, {min: v}); });
  document.getElementById("w-int").addEventListener("input", ev => saveWorkout(id, {int: ev.target.value.trim()}));
  $view.querySelectorAll(".exedit").forEach(card => {
    const eid = card.dataset.eid;
    card.querySelectorAll("[data-f]").forEach(inp => inp.addEventListener(inp.type === "checkbox" || inp.tagName === "SELECT" ? "change" : "input", () => {
      const f = inp.dataset.f, raw = inp.value.trim().replace(",", ".");
      if (f === "name") { if (raw) saveEx(eid, {name: inp.value.trim()}); return; }
      if (f === "role") { saveEx(eid, {role: raw}); return; }
      if (f === "pause" || f === "per") { saveEx(eid, {[f]: inp.value.trim() || null}); return; }
      if (f.startsWith("str.")) {
        const v = Math.round(Number(raw)); if (!(v > 0) || v > 1000) return;
        const k = f.slice(4), cur = {...(EX[eid].str || {sets: EX[eid].sets, lo: EX[eid].lo, hi: EX[eid].hi}), [k]: v};
        if (k === "lo" && cur.hi < cur.lo) cur.hi = cur.lo;
        if (k === "hi" && cur.hi < cur.lo) return;
        saveEx(eid, {str: cur}); return;
      }
      if (f === "unit") { saveEx(eid, {unit: raw || null}); return rerender(); }
      if (f === "bodyweight") { saveEx(eid, {bodyweight: inp.checked}); return rerender(); }
      if (f === "start") { if (raw !== "" && !(Number(raw) >= 0)) return; saveEx(eid, {start: raw === "" ? null : Number(raw)}); return; }
      const v = Number(raw); if (!(v > 0) || v > 1000) return;
      const patch = {[f]: f === "inc" ? v : Math.round(v)};
      const cur = {...EX[eid], ...patch};
      if (f === "lo" && cur.hi < cur.lo) patch.hi = cur.lo;
      if (f === "hi" && cur.hi < cur.lo) return;
      saveEx(eid, patch);
    }));
  });
  $view.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, j = i + +b.dataset.mv, list = [...WORKOUTS[id].ex]; [list[i], list[j]] = [list[j], list[i]];
    saveWorkout(id, {ex: list}); rerender();
  });
  $view.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    const i = +b.dataset.rm, list = [...WORKOUTS[id].ex], name = EX[list[i]].name; list.splice(i, 1);
    saveWorkout(id, {ex: list}); rerender(`„${name}“ entfernt. Bisherige Einträge dazu bleiben gespeichert, du kannst die Übung unten wieder hinzufügen.`);
  });
  document.getElementById("addExisting").addEventListener("change", ev => {
    const eid = ev.target.value; if (!eid) return;
    saveWorkout(id, {ex: [...WORKOUTS[id].ex, eid]}); rerender(`„${EX[eid].name}“ hinzugefügt.`); window.scrollTo(0, document.body.scrollHeight);
  });
  document.getElementById("addNew").onclick = () => {
    const eid = "x_" + Date.now().toString(36);
    cust().ex[eid] = {name: "Neue Übung", role: "acc", sets: 3, lo: 8, hi: 10, str: {sets: 3, lo: 6, hi: 8}, inc: 2.5, pause: "90 s"};
    saveWorkout(id, {ex: [...WORKOUTS[id].ex, eid]}); rerender();
    const inp = $view.querySelector(`.exedit[data-eid="${eid}"] [data-f="name"]`); if (inp) { inp.scrollIntoView({block:"center"}); inp.select(); }
  };
  const rs = document.getElementById("w-reset");
  if (rs) rs.onclick = () => {
    if (rs.dataset.armed !== "1") { rs.dataset.armed = "1"; rs.textContent = "Wirklich zurücksetzen? Nochmal tippen"; return; }
    delete c.workouts[id]; WORKOUTS_BASE[id].ex.forEach(e => delete c.ex[e]);
    persist("custom/main"); rerender("Auf den Originalplan zurückgesetzt. Deine Einträge bleiben erhalten.");
  };
}

function render() {
  header();
  ({day:renderDay, week:renderWeek, plan:renderPlan, progress:renderProgress, edit:renderEdit})[state.tab]();
}
function setTab(t) {
  state.tab = t;
  if (t === "week") state.weekStart = mondayOf(state.date);
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === (t === "edit" ? "plan" : t) ? "page" : "false"));
  render(); window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));

// ---------- boot ----------
lsLoad(); render(); setSync();
Sync.schedule(300);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") Sync.schedule(300); else Sync.run(); });
window.addEventListener("online", () => Sync.schedule(300));
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
</script>
</body>
</html>
